# Multimodal Soccer Event Retrieval Settings

# Data Source Provenance: 'synthetic' (generated by mock_data_gen.py) or 'real' (GSR tracking data)
data_source: synthetic

paths:
  tracking_data: "data/sample_tracking.json"
  ground_truth_events: "data/ground_truth_events.json"
  video_file: "data/sample_match.mp4"
  pitch_config: "data/pitch_config.json"
  chroma_db_dir: "data/chroma_db"

preprocessing:
  fps: 25.0
  max_interpolation_gap_frames: 8
  possession_dwell_time_frames: 5
  pressing_dwell_time_frames: 10
  possession_max_distance_meters: 1.5
  pressing_max_distance_meters: 5.0
  pressing_min_defenders: 3
  pass_min_velocity_m_per_s: 3.5

chunking:
  instantaneous_event_window_before_sec: 2.0
  instantaneous_event_window_after_sec: 4.0
  continuous_spell_min_duration_sec: 8.0

rag:
  embedding_model: "all-MiniLM-L6-v2"
  vector_store_collection: "soccer_match_events"
  retriever_top_k: 4
  llm_provider: "huggingface" # Options: huggingface, ollama, openai, mock
  llm_model_name: "google/flan-t5-base"

video:
  output_clip_dir: "data/clips"
